<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music player</title>
    <link rel="stylesheet" href="CSS.css">
    <script src="https://kit.fontawesome.com/95c13bdaf0.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="music_container">
            <nav class="menu">
                <div><i class="fa-solid fa-xmark"></i></div>
                <div><i class="fa-solid fa-bars"></i></div>
            </nav>
            <div class="img">
                <img src="music/download (1).jpg" alt="Music">
            </div>
            <h2>Ariana Grande</h2>
            <p>Kaka New Punjabi Song.</p>
            <audio controls id="control">
                <source src="music/music 1.mp3" type="audio/mp3">
            </audio>
            <input type="range" class="music_range">
            <div class="footer_menu">
                <div><i class="fa-solid fa-backward-step" id="backward_icon"></i></div>
                <div><i class="fa-solid fa-play" id="play_icon"></i></div>
                <div><i class="fa-solid fa-forward-step" id="forward_icon"></i></div>
            </div>
        </div>
    </div>
    <script src="Javascript.js"></script>
</body>
</html>

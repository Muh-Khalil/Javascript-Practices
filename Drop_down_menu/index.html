<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop down menu</title>
    <link rel="stylesheet" href="CSS.css"/>
</head>
<body>
    <div class="menu">
        <div class="menu_text">
            <input type="text" placeholder="text" id="text">
            <img src="icon/backward_icon.png" alt="Icon" id="icon">
        </div>
        <ul class="visibility_mode">
            <li>
                <img src="icon/facebook icon.jpg" alt="Facebook">
                <p>Facebook</p>
            </li>
            <li>
                <img src="icon/Twitter icon.jpg" alt="Twitter">
                <p>Twitter</p>
            </li>
            <li>
                <img src="icon/YouTube icon.jpg" alt="YouTube">
                <p>YouTube</p>
            </li>
            <li>
                <img src="icon/Instagram icon.jpg" alt="Instagram">
                <p>Instagram</p>
            </li>
        </ul>
    </div>

    <script src="Javascript.js"></script>
</body>
</html>
